services:
  app:
    build:
      context: .              # ← كان .. دلوقتي .
      dockerfile: Dockerfile  # ← مش src/Dockerfile
    image: pharaohs-guide-app
    ports:
      - "3000:3000"
    env_file:
      - .env                  # ← كان ../.env
    depends_on:
      - mongo
      - redis
    volumes:
      - .:/app                # ← كان ..:/app
      - /app/node_modules

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

volumes:
  mongo_data: